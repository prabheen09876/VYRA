<!DOCTYPE html>
<!--
  The web HTML shell for the Expo app.

  Why this file exists rather than `app/+html.tsx`: app.json sets `web.output: "single"`, and under
  "single" expo-router never loads a +html component — the shell comes from this static template
  instead (@expo/cli webTemplate.js `getTemplateIndexHtmlAsync` reads `public/index.html` first and
  only falls back to its own bundled copy when that is missing; it is the single entry point for
  BOTH `expo start --web` and `expo export`). Without this file the document body has no background
  and no color-scheme, so the pre-hydration paint and the overscroll gutter flash white against the
  app's #05070A ground.

  This is the bundled template plus the `html, body` rule in the reset block. Leave the two percent-
  delimited placeholders on the html and title elements below alone, and keep the closing head and
  body tags intact: the CLI fills all four in with a plain single-occurrence String.replace, so it
  rewrites the FIRST match in the file and nothing else. That is why this comment spells none of
  them out — an earlier revision that quoted them here swallowed the title substitution, and the
  page shipped with a literal placeholder for its <title>.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Self-hosted type. See public/fonts/README.md for provenance and the OFL notice.

      Only the two latin files are preloaded: they are what English copy actually pulls, and a
      preload the page does not use costs a console warning plus wasted bandwidth. The -ext files
      stay behind their unicode-range and download only if a character outside basic latin appears.

      `font-display: block` rather than `swap`, deliberately. The hero headline's font size is
      DERIVED from the measured width of the display face (src/lib/displayMetrics.web.ts divides the
      column width by the measured ems). Under `swap` the first paint measures the fallback face,
      which is a different width, and the headline would either wrap or snap to a new size when the
      real font arrives. `block` keeps the text invisible for a short period instead of painting it
      twice at two different sizes; displayMetrics additionally refuses to cache a measurement taken
      before the face is ready.
    -->
    <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style id="vyra-fonts">
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 200 700;
        font-display: block;
        src: url('/fonts/oswald-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Oswald';
        font-style: normal;
        font-weight: 200 700;
        font-display: block;
        src: url('/fonts/oswald-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* VYRA Halo ground — `colors.background` in src/theme.ts, the same value
           app/_layout.tsx paints via the Stack `contentStyle`. Repeated here because the
           document paints before any JS runs. `color-scheme: dark` additionally darkens the
           scrollbars and the overscroll gutter, which no React style can reach. */
        background-color: #05070a;
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
