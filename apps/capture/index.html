<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />
    <title>VYRA · Movement studio</title>
    <!--
      Only Inter is preloaded. Oswald is used by exactly three rules (.brand, h1, .lab h2) and all
      three live in the masthead/lab chrome, which `body.embedded` hides — and embedded, inside
      CaptureFrame's WebView, is how this document is usually loaded. Preloading a face that mode
      never paints would cost 28 KB on the same connection that is fetching the pose model.
      The @font-face declarations themselves are in src/styles.css.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
