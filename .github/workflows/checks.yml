name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run worker:types
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:verify
      - run: npm run build
      - run: npm run export:all -w @vyra/mobile
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml -p 'test_*.py'
      - run: python ml/software_fixture.py
      - run: npm test -- packages/core/src/inference.test.ts
        env:
          MODEL_PARITY_FIXTURE: ml/runs/software-fixture/parity.json
